<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>설마중 | 기업 식사 문의 시안</title><link rel="stylesheet" href="assets/design.css"><link rel="stylesheet" href="assets/interaction.css"><link rel="stylesheet" href="assets/review.css"></head><body class="detail-page"><main class="detail-main"><nav><a class="action-link" href="index.html">공유 홈 <span aria-hidden="true">→</span></a><a class="action-link" href="deck.html#1">24장 제안서 <span aria-hidden="true">→</span></a><a class="action-link" href="scope.html">작업 범위 <span aria-hidden="true">→</span></a></nav><div class="eyebrow">설마중 · 제안 검토본</div><h1>기업 식사 문의 시안</h1><p class="">전송·저장하지 않는 체험용 시안입니다. 실제 개인정보를 입력하지 마세요. 선택한 항목은 이 화면에서만 확인할 수 있습니다.</p><form id="demo" autocomplete="off"><div class="form-grid"><label for="purpose">모임 목적<select id="purpose" name="purpose"><option>기업 회식</option><option>기업 접대</option><option>가족 식사</option></select></label><label for="date">희망 일정<select id="date" name="date"><option>일정 미정</option><option>평일 점심 희망</option><option>평일 저녁 희망</option><option>주말 희망</option></select></label><label for="people">예상 인원<select id="people" name="people"><option>인원 협의 필요</option><option>참석자 확정 전</option><option>참석자 확정 후 문의</option></select></label><label for="menu">메뉴·예산<select id="menu" name="menu"><option>메뉴 구성 안내 필요</option><option>예산 조건 별도 전달</option></select></label><label for="room">공간 조건<select id="room" name="room"><option>공간 안내 필요</option><option>독립 공간 가능 여부 확인</option></select></label><label for="payment">정산 방식<select id="payment" name="payment"><option>결제·증빙 안내 필요</option><option>담당자 확인 후 진행</option></select></label></div><p style="margin-top:24px"><button type="submit">문의 전 확인 항목 보기</button> <button type="reset">선택 초기화</button></p><div id="result" class="demo-result" role="status" hidden></div></form><p class="notice">가격 추후 공개 · 계약·운영 조건은 별도 합의합니다. 가상 일러스트를 사용한 문안 검토본입니다. 실제 매장 사진 중심 최종본은 사진 확인 후 교체합니다.</p></main><script>const f=document.getElementById('demo'),r=document.getElementById('result');f.addEventListener('submit',e=>{e.preventDefault();r.hidden=false;r.replaceChildren();const h=document.createElement('h2');h.textContent='문의 전 확인 목록';r.append(h);for(const s of f.querySelectorAll('select')){const p=document.createElement('p');p.textContent=s.previousSibling?.textContent+' : '+s.value;r.append(p)}const n=document.createElement('p');n.textContent='이 내용은 전송·저장되지 않았습니다. 예약 접수나 확정이 아닙니다. 실제 운영 조건과 공식 문의 경로는 매장 확인이 필요합니다.';r.append(n)});f.addEventListener('reset',()=>{r.hidden=true;r.replaceChildren()});</script></body></html>
